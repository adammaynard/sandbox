<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Simple bus icon for favicon -->
  <rect x="10" y="25" width="80" height="50" rx="8" fill="#FFD700" stroke="#333" stroke-width="4"/>

  <!-- Roof -->
  <path d="M 15 25 Q 50 15 85 25" fill="#FFA500" stroke="#333" stroke-width="3"/>

  <!-- Windows -->
  <rect x="18" y="32" width="18" height="15" rx="2" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="41" y="32" width="18" height="15" rx="2" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="64" y="32" width="18" height="15" rx="2" fill="#87CEEB" stroke="#333" stroke-width="2"/>

  <!-- Wheels -->
  <circle cx="28" cy="75" r="10" fill="#333"/>
  <circle cx="28" cy="75" r="6" fill="#666"/>

  <circle cx="72" cy="75" r="10" fill="#333"/>
  <circle cx="72" cy="75" r="6" fill="#666"/>

  <!-- Bumper -->
  <rect x="8" y="70" width="84" height="5" rx="2" fill="#E65100" stroke="#333" stroke-width="2"/>
</svg>
