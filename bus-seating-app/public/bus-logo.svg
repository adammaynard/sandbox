<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- Bus body -->
  <rect x="20" y="30" width="160" height="80" rx="15" fill="#FFD700"/>
  <rect x="20" y="30" width="160" height="80" rx="15" fill="none" stroke="#333" stroke-width="3"/>

  <!-- Bus roof -->
  <path d="M 30 30 Q 100 10 170 30" fill="#FFA500" stroke="#333" stroke-width="3"/>

  <!-- Windows -->
  <rect x="35" y="45" width="30" height="25" rx="3" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="75" y="45" width="30" height="25" rx="3" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="115" y="45" width="30" height="25" rx="3" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="155" y="45" width="15" height="25" rx="3" fill="#87CEEB" stroke="#333" stroke-width="2"/>

  <!-- Window reflections -->
  <rect x="37" y="47" width="10" height="8" rx="2" fill="white" opacity="0.6"/>
  <rect x="77" y="47" width="10" height="8" rx="2" fill="white" opacity="0.6"/>
  <rect x="117" y="47" width="10" height="8" rx="2" fill="white" opacity="0.6"/>

  <!-- Door -->
  <rect x="25" y="75" width="25" height="35" rx="3" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
  <circle cx="45" cy="92" r="2" fill="#333"/>

  <!-- Wheels -->
  <circle cx="50" cy="110" r="18" fill="#333"/>
  <circle cx="50" cy="110" r="12" fill="#666"/>
  <circle cx="50" cy="110" r="6" fill="#999"/>

  <circle cx="150" cy="110" r="18" fill="#333"/>
  <circle cx="150" cy="110" r="12" fill="#666"/>
  <circle cx="150" cy="110" r="6" fill="#999"/>

  <!-- Headlights -->
  <circle cx="25" cy="95" r="4" fill="#FFEB3B" stroke="#333" stroke-width="1"/>
  <circle cx="175" cy="95" r="4" fill="#FFEB3B" stroke="#333" stroke-width="1"/>

  <!-- Bumper -->
  <rect x="15" y="105" width="170" height="5" rx="2" fill="#E65100" stroke="#333" stroke-width="2"/>

  <!-- Side details -->
  <line x1="35" y1="75" x2="170" y2="75" stroke="#333" stroke-width="2"/>

  <!-- Happy face on front -->
  <circle cx="100" cy="90" r="3" fill="#333"/>
  <path d="M 85 95 Q 100 102 115 95" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>
